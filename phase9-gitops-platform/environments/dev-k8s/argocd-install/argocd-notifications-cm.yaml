# ConfigMap cho argocd-notifications-controller (cài manifest/Helm đều dùng CM này).
# Secret riêng: argocd-notifications-secret key telegram-token (script seed từ Vault).
# Chat Telegram lab: -1004489182185
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
data:
  context: |
    argocdUrl: https://npd-argocd.co
  service.telegram: |
    token: $telegram-token
  template.app-sync-succeeded: |
    message: |
      ✅ <b>ArgoCD SYNC SUCCESS</b>
      app: <code>{{.app.metadata.name}}</code>
      {{- with .app.spec.destination.namespace }}
      ns: <code>{{.}}</code>{{ end }}
      {{- with .app.status.sync.revision }}
      rev: <code>{{. | trunc 8}}</code>{{ end }}
      {{- with .app.status.operationState.finishedAt }}
      finished: {{.}}{{ end }}
      <a href="{{.context.argocdUrl}}/applications/{{.app.metadata.name}}">Open ArgoCD</a>
  template.app-sync-failed: |
    message: |
      ❌ <b>ArgoCD SYNC FAILED</b>
      app: <code>{{.app.metadata.name}}</code>
      {{- with .app.spec.destination.namespace }}
      ns: <code>{{.}}</code>{{ end }}
      {{- with .app.status.operationState.message }}
      msg: <code>{{.}}</code>{{ end }}
      <a href="{{.context.argocdUrl}}/applications/{{.app.metadata.name}}">Open ArgoCD</a>
  template.app-deployed: |
    message: |
      🟢 <b>ArgoCD DEPLOYED</b>
      app: <code>{{.app.metadata.name}}</code>
      {{- with .app.spec.destination.namespace }}
      ns: <code>{{.}}</code>{{ end }}
      health: <code>{{.app.status.health.status}}</code>
      sync: <code>{{.app.status.sync.status}}</code>
      <a href="{{.context.argocdUrl}}/applications/{{.app.metadata.name}}">Open ArgoCD</a>
  template.app-health-degraded: |
    message: |
      🟠 <b>ArgoCD HEALTH DEGRADED</b>
      app: <code>{{.app.metadata.name}}</code>
      {{- with .app.spec.destination.namespace }}
      ns: <code>{{.}}</code>{{ end }}
      health: <code>{{.app.status.health.status}}</code>
      <a href="{{.context.argocdUrl}}/applications/{{.app.metadata.name}}">Open ArgoCD</a>
  trigger.on-sync-succeeded: |
    - description: Application sync finished successfully
      oncePer: app.status.sync.revision
      send:
        - app-sync-succeeded
      when: app.status.operationState.phase in ['Succeeded']
  trigger.on-sync-failed: |
    - description: Application syncing has failed
      send:
        - app-sync-failed
      when: app.status.operationState.phase in ['Error', 'Failed']
  trigger.on-deployed: |
    - description: Application is synced and healthy
      oncePer: app.status.sync.revision
      send:
        - app-deployed
      when: app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
  trigger.on-health-degraded: |
    - description: Application has degraded
      send:
        - app-health-degraded
      when: app.status.health.status == 'Degraded'
  subscriptions: |
    - recipients:
        - telegram:-1004489182185
      triggers:
        - on-sync-succeeded
        - on-sync-failed
