# Redis HA (Bitnami, Sentinel), ns redis
# Values: environments/dev-k8s/values/values-redis-ha.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-redis
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: phase9-gitops
    app.kubernetes.io/component: redis
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  sources:
    - repoURL: https://charts.bitnami.com/bitnami
      chart: redis
      targetRevision: 20.6.2
      helm:
        releaseName: redis-ha
        valueFiles:
          - $values/phase9-gitops-platform/environments/dev-k8s/values/values-redis-ha.yaml
    - repoURL: https://github.com/kevinram164/cloud-native-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: redis
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: false
      selfHeal: true
