# Strimzi Operator (Helm) · ns kafka
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-strimzi
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: phase9-gitops
    app.kubernetes.io/component: kafka
    npd/shared-platform: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: https://strimzi.io/charts/
    chart: strimzi-kafka-operator
    targetRevision: 0.46.1
    helm:
      releaseName: strimzi-kafka-operator
      values: |
        watchNamespaces:
          - kafka
        watchAnyNamespace: false
        # K8s ≥1.33 trả /version.emulationMajor — fabric8 trong Strimzi 0.46 không parse được
        extraEnvs:
          - name: STRIMZI_KUBERNETES_VERSION
            value: "major=1,minor=30"
        resources:
          requests:
            cpu: 200m
            memory: 384Mi
          limits:
            cpu: "1"
            memory: 768Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: false
      selfHeal: true
