# Observability (dev-k8s) — sync sau platform, trước khi deploy app (banking-demo, ...)
#   wave 0: kube-prometheus-stack (ns monitoring), eck-operator (ns elastic-system)
#   wave 1: monitoring-config (ServiceMonitor/Rule/dashboard/ingress), elastic-stack (ES/Kibana/APM, ns observability)
#   wave 2: fluent-bit (log → ES), otel-collector (OTLP → APM Server)
# Mỗi app tự CreateNamespace + giữ Ingress của mình → không phụ thuộc namespace của app khác.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-app-of-apps-dev-k8s
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: phase9-gitops
    platform/environment: dev-k8s
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: https://github.com/kevinram164/cloud-native-platform.git
    targetRevision: main
    path: phase9-gitops-platform/environments/dev-k8s/argocd/applications/observability
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
