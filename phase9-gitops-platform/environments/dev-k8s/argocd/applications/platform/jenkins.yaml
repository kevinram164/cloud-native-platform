# Jenkins — https://npd-jenkins.co
# Login: SSO Keycloak (client jenkins, secret Vault platform/keycloak-clients.jenkins)
# Escape hatch: Vault secret/platform/jenkins {admin_username, admin_password}
#   → Vault Agent Injector (role jenkins, SA jenkins) → /vault/secrets/* → JCasC readFile
# Pipeline CI: agent SA jenkins-kaniko (manifests/base) đọc trực tiếp Vault (platform/harbor, platform/github)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-jenkins
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: phase9-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  source:
    repoURL: https://charts.jenkins.io
    chart: jenkins
    targetRevision: 5.7.27
    helm:
      releaseName: jenkins
      values: |
        persistence:
          enabled: true
          storageClass: nfs-csi
          size: 8Gi
          accessMode: ReadWriteOnce
        controller:
          image:
            registry: docker.io
            repository: jenkins/jenkins
            tag: "lts-jdk17"
            pullPolicy: Always
          admin:
            createSecret: false
          # Chart chạy tpl trên podAnnotations: template Vault bọc trong {{` `}} để Helm giữ nguyên.
          # Viết nhiều dòng + trim (-) để toYaml không gập dòng và file render không có newline.
          podAnnotations:
            vault.hashicorp.com/agent-inject: "true"
            vault.hashicorp.com/agent-init-first: "true"
            vault.hashicorp.com/agent-pre-populate-only: "true"
            vault.hashicorp.com/role: "jenkins"
            vault.hashicorp.com/agent-inject-secret-admin-user: "secret/data/platform/jenkins"
            vault.hashicorp.com/agent-inject-template-admin-user: |-
              {{`{{- with secret "secret/data/platform/jenkins" -}}
              {{- .Data.data.admin_username -}}
              {{- end -}}`}}
            vault.hashicorp.com/agent-inject-secret-admin-password: "secret/data/platform/jenkins"
            vault.hashicorp.com/agent-inject-template-admin-password: |-
              {{`{{- with secret "secret/data/platform/jenkins" -}}
              {{- .Data.data.admin_password -}}
              {{- end -}}`}}
            # Client secret Keycloak (scripts/keycloak-sso-setup.sh ghi vào Vault).
            # Chưa có secret → vault-agent-init chờ, Jenkins chưa start.
            vault.hashicorp.com/agent-inject-secret-oidc-client-secret: "secret/data/platform/keycloak-clients"
            vault.hashicorp.com/agent-inject-template-oidc-client-secret: |-
              {{`{{- with secret "secret/data/platform/keycloak-clients" -}}
              {{- .Data.data.jenkins -}}
              {{- end -}}`}}
          jenkinsUrl: https://npd-jenkins.co/
          installLatestPlugins: false
          installPlugins:
            - kubernetes:4437.v3a_18554d3f32
            - workflow-aggregator:608.v67378e9d3db_1
            - pipeline-model-api:2.2255.v56a_15e805f12
            - pipeline-model-definition:2.2255.v56a_15e805f12
            - pipeline-model-extensions:2.2255.v56a_15e805f12
            - workflow-multibranch:821.vc3b_4ea_780798
            - git:5.10.1
            - configuration-as-code:2100.vb_fd699d2a_09c
            - pipeline-groovy-lib:798.v5cc688825312
            - durable-task:686.v80ff80875b_82
            - pipeline-utility-steps:2.19.0
            # SSO Keycloak (JCasC securityRealm.oic). config.xml cũ trên NFS cũng dùng OicSecurityRealm.
            - oic-auth:4.690.v5821cf665e43
          additionalPlugins: []
          overwritePlugins: true
          # false → chart bỏ mount emptyDir /usr/share/jenkins/ref/plugins ở init container,
          # trong khi rootfs read-only → jenkins-plugin-cli không tạo được thư mục download.
          overwritePluginsFromImage: true
          initializeOnce: false
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 2Gi
          javaOpts: >-
            -Dorg.jenkinsci.plugins.durabletask.BourneShellScript.HEARTBEAT_CHECK_INTERVAL=86400
            -Dorg.jenkinsci.plugins.durabletask.BourneShellScript.USE_BINARY_WRAPPER=true
          initContainerResources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
          JCasC:
            defaultConfig: true
            # SSO Keycloak (realm platform, client jenkins). Escape hatch: admin + mật khẩu Vault
            # (secret/platform/jenkins) khi Keycloak không truy cập được.
            securityRealm: |-
              oic:
                clientId: "jenkins"
                clientSecret: "${readFile:/vault/secrets/oidc-client-secret}"
                serverConfiguration:
                  wellKnown:
                    wellKnownOpenIDConfigurationUrl: "https://npd-keycloak.co/realms/platform/.well-known/openid-configuration"
                    scopesOverride: "openid profile email"
                userNameField: "preferred_username"
                fullNameFieldName: "name"
                emailFieldName: "email"
                groupsFieldName: "groups"
                logoutFromOpenidProvider: true
                postLogoutRedirectUrl: "https://npd-jenkins.co/"
                disableSslVerification: true
                properties:
                  - escapeHatch:
                      username: "${readFile:/vault/secrets/admin-user}"
                      secret: "${readFile:/vault/secrets/admin-password}"
            configScripts:
              banking-shared-library: |
                unclassified:
                  globalLibraries:
                    libraries:
                      - name: "platform"
                        defaultVersion: "main"
                        retriever:
                          modernSCM:
                            libraryPath: ""
                            scm:
                              git:
                                remote: "https://github.com/kevinram164/jenkins-shared-library.git"
                      - name: "banking-demo"
                        defaultVersion: "main"
                        retriever:
                          modernSCM:
                            libraryPath: ""
                            scm:
                              git:
                                remote: "https://github.com/kevinram164/jenkins-shared-library.git"
          ingress:
            enabled: false
        agent:
          enabled: true
          kubernetes:
            namespace: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
