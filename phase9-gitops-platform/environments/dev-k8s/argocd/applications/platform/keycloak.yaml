# Keycloak — OIDC IdP dùng chung (realm platform) — https://npd-keycloak.co
# SSO cho ArgoCD, Harbor, Jenkins. DB: postgres-ha (stage infra) → retry tới khi Postgres sẵn sàng.
# Secret: Vault secret/platform/keycloak {admin_password, db_password} (role keycloak).
# Sau khi Ready: scripts/keycloak-sso-setup.sh (realm/client/group → client secret vào Vault).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-keycloak
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: phase9-gitops
    app.kubernetes.io/component: idp
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: platform
  sources:
    - repoURL: https://github.com/kevinram164/cloud-native-platform.git
      targetRevision: main
      path: phase9-gitops-platform/environments/dev-k8s/manifests/keycloak
    - repoURL: https://charts.bitnami.com/bitnami
      chart: keycloak
      targetRevision: 25.2.0
      helm:
        releaseName: keycloak
        valueFiles:
          - $values/phase9-gitops-platform/environments/dev-k8s/values/values-keycloak.yaml
    - repoURL: https://github.com/kevinram164/cloud-native-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
