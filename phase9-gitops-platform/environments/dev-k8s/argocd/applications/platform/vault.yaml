# HashiCorp Vault — https://npd-vault.co (standalone, file storage trên nfs-csi)
# Sau MỖI lần pod restart: vault operator unseal (3/5 key từ operator init).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-vault
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: phase9-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.28.1
    helm:
      releaseName: vault
      values: |
        # Agent Injector: pod có annotation vault.hashicorp.com/agent-inject nhận secret qua /vault/secrets/*
        # Cấu hình auth/policy/role: environments/dev-k8s/scripts/vault-setup-k8s-auth.sh
        injector:
          enabled: true
          replicas: 1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          agentDefaults:
            cpuRequest: 50m
            memRequest: 32Mi
            cpuLimit: 250m
            memLimit: 128Mi
        server:
          ha:
            enabled: false
          dev:
            enabled: false
          standalone:
            enabled: true
            config: |
              ui = true
              listener "tcp" {
                address     = "[::]:8200"
                cluster_address = "[::]:8201"
                tls_disable = 1
              }
              storage "file" {
                path = "/vault/data"
              }
          dataStorage:
            enabled: true
            size: 2Gi
            storageClass: nfs-csi
            accessMode: ReadWriteOnce
          # 204 = uninitialized/sealed — pod vẫn Ready để exec init/unseal
          readinessProbe:
            path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
          ingress:
            enabled: false
        ui:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
