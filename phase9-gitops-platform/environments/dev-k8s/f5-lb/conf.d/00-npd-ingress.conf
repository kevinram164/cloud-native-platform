# f5-lb (NGINX Plus 10.100.1.100) → HAProxy ingress npd-route 10.100.1.46:8443 (HTTPS)
# HAProxy route theo Host header → Ingress trong cụm. Mọi domain npd-<app>.co dùng chung upstream này.
# Copy: conf.d/*.conf → /etc/nginx/conf.d/, npd-proxy-params.conf → /etc/nginx/

upstream npd_ingress {
    zone npd_ingress 64k;
    server 10.100.1.46:8443 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# HTTP → HTTPS cho mọi domain npd-*.co
server {
    listen 80;
    server_name ~^npd-.+\.co$;
    return 301 https://$host$request_uri;
}
