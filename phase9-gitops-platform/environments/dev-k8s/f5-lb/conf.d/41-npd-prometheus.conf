# https://npd-prometheus.co → Prometheus (ns monitoring) — không auth, chỉ mạng nội bộ
server {
    listen 443 ssl;
    http2 on;
    server_name npd-prometheus.co;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    client_max_body_size 10m;

    location / {
        include /etc/nginx/npd-proxy-params.conf;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
