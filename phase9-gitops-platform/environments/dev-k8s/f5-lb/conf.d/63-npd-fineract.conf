# https://npd-fineract.co → fineract-server (ns npd-fineract)
server {
    listen 443 ssl;
    http2 on;
    server_name npd-fineract.co;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    client_max_body_size 50m;

    location / {
        include /etc/nginx/npd-proxy-params.conf;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
