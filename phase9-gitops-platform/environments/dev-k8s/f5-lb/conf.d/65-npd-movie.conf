# https://npd-movie.co → CineHome movie-web (ns npd-movie). Public: cinehome.automationecom.click qua Cloudflare Tunnel.
server {
    listen 443 ssl;
    http2 on;
    server_name npd-movie.co;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    client_max_body_size 100m;

    location / {
        include /etc/nginx/npd-proxy-params.conf;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
