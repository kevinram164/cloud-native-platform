# https://npd-keycloak.co → Keycloak (realm platform, ns keycloak)
server {
    listen 443 ssl;
    http2 on;
    server_name npd-keycloak.co;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    client_max_body_size 10m;
    # Keycloak trả header lớn (cookie session + token)
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    # nginx.conf (http) đặt giá trị nhỏ hơn; phải >= max(proxy_buffer_size, proxy_buffers)
    proxy_temp_file_write_size 256k;

    location / {
        include /etc/nginx/npd-proxy-params.conf;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
