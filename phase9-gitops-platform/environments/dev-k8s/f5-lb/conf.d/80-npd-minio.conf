# https://npd-minio.co → MinIO S3 API (ns minio)
# Upload object lớn (media, backup): không giới hạn body, không buffer
server {
    listen 443 ssl;
    http2 on;
    server_name npd-minio.co;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    client_max_body_size 0;
    chunked_transfer_encoding on;

    location / {
        include /etc/nginx/npd-proxy-params.conf;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
