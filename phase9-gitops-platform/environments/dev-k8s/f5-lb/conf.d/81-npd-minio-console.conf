# https://npd-minio-console.co → MinIO Console (ns minio), upload qua UI + WebSocket
server {
    listen 443 ssl;
    http2 on;
    server_name npd-minio-console.co;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    client_max_body_size 0;

    location / {
        include /etc/nginx/npd-proxy-params.conf;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
