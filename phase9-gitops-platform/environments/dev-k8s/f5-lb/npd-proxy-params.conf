# include trong location / của từng domain (đặt ở /etc/nginx/, KHÔNG để trong conf.d)
proxy_pass https://npd_ingress;
proxy_http_version 1.1;

# HAProxy ingress dùng cert tự ký → không verify; gửi SNI = domain
proxy_ssl_server_name on;
proxy_ssl_name $host;
proxy_ssl_verify off;
proxy_ssl_session_reuse on;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port 443;

# WebSocket (ArgoCD logs, Jenkins, Grafana live, Kafka UI, banking notification)
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_redirect off;
proxy_connect_timeout 10s;
# proxy_read_timeout / proxy_send_timeout đặt trong từng file domain (Harbor cần giá trị khác)
