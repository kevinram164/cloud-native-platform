apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coroot
  namespace: observability
  annotations:
    haproxy.org/ssl-redirect: "false"
spec:
  ingressClassName: haproxy
  rules:
    - host: coroot-npd.co
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: coroot-coroot
                port:
                  number: 8080
