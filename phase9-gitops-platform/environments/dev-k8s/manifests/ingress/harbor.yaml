apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: harbor
  namespace: platform
  annotations:
    haproxy.org/ssl-redirect: "false"
    haproxy.org/timeout-server: "600s"
spec:
  ingressClassName: haproxy
  rules:
    - host: npd-harbor.co
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: harbor
                port:
                  number: 80
