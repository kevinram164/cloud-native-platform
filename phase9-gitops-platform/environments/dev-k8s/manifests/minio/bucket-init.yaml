# Tạo bucket + policy sau mỗi lần sync (idempotent). Thêm bucket: sửa BUCKETS / PUBLIC_BUCKETS.
# Root credential qua Vault Agent (role minio, SA minio-bucket-init).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio-bucket-init
  namespace: minio
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-init
  namespace: minio
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/role: "minio"
        vault.hashicorp.com/agent-inject-secret-root: "secret/data/platform/minio"
        vault.hashicorp.com/agent-inject-template-root: |
          {{- with secret "secret/data/platform/minio" -}}
          export MINIO_ROOT_USER='{{ .Data.data.root_user }}'
          export MINIO_ROOT_PASSWORD='{{ .Data.data.root_password }}'
          {{- end }}
    spec:
      serviceAccountName: minio-bucket-init
      restartPolicy: OnFailure
      containers:
        - name: mc
          # docker.io/minio/mc đã bị gỡ khỏi Docker Hub (MinIO ngừng phát hành image community)
          image: docker.io/bitnamilegacy/minio-client:2025.7.21-debian-12-r3
          env:
            - name: HOME
              value: /tmp
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
            - name: BUCKETS
              value: "movies posters raw backups"
            - name: PUBLIC_BUCKETS
              value: "movies posters"
          command:
            - /bin/sh
            - -c
            - |
              set -e
              . /vault/secrets/root
              until mc alias set local http://minio.minio.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null; do
                echo "chờ MinIO..."; sleep 5
              done
              for b in $BUCKETS; do mc mb -p "local/$b"; done
              for b in $PUBLIC_BUCKETS; do mc anonymous set download "local/$b"; done
              mc ls local
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
