# Báo cáo tình trạng cụm → Telegram lúc 08:00, 15:00, 22:00 giờ VN (port từ monitoring/manifests/digest, OCP).
# Query thẳng Prometheus trong cụm (không auth). Bot token: Vault role alertmanager (secret/platform/alertmanager-telegram).
# Chạy thử: kubectl -n monitoring create job --from=cronjob/npd-status-digest digest-test
apiVersion: v1
kind: ServiceAccount
metadata:
  name: npd-status-digest
  namespace: monitoring
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: npd-status-digest
  namespace: monitoring
  labels:
    app.kubernetes.io/name: npd-status-digest
    app.kubernetes.io/part-of: npd-monitoring
spec:
  schedule: "0 8,15,22 * * *"
  timeZone: Asia/Ho_Chi_Minh
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: npd-status-digest
          annotations:
            vault.hashicorp.com/agent-inject: "true"
            vault.hashicorp.com/agent-pre-populate-only: "true"
            vault.hashicorp.com/role: "alertmanager"
            vault.hashicorp.com/agent-inject-secret-telegram-bot-token: "secret/data/platform/alertmanager-telegram"
            vault.hashicorp.com/agent-inject-template-telegram-bot-token: |
              {{- with secret "secret/data/platform/alertmanager-telegram" -}}
              {{ .Data.data.bot_token }}
              {{- end }}
        spec:
          serviceAccountName: npd-status-digest
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: digest
              image: docker.io/library/python:3.12-alpine
              imagePullPolicy: IfNotPresent
              command: ["python3", "/digest/report.py"]
              env:
                - name: TELEGRAM_CHAT_ID
                  value: "-1004489182185"
                - name: PROMETHEUS_URL
                  value: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
                - name: GRAFANA_URL
                  value: https://npd-grafana.co
                - name: CLUSTER_NAME
                  value: npd-k8s
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: script
                  mountPath: /digest
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: npd-status-digest-script
