# Monitoring config cho kube-prometheus-stack (app observability-monitoring-config).
# Dashboard: thả file .json vào dashboards/ rồi thêm vào configMapGenerator (kèm options như các dashboard
# khác); Grafana sidecar nạp mọi ConfigMap có label grafana_dashboard=1, folder theo annotation grafana_folder.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - servicemonitors.yaml
  - scrape-nfs-server.yaml
  - rules-apps.yaml
  - rules-infra.yaml
  - rules-platform.yaml
  - ingress.yaml
  - digest/cronjob.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: dashboard-npd-banking
    files: [dashboards/npd-banking.json]
    options: &dashboard
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: NPD
  - name: dashboard-npd-shop
    files: [dashboards/npd-shop.json]
    options: *dashboard
  - name: dashboard-npd-infra
    files: [dashboards/npd-infra.json]
    options: *dashboard
  - name: dashboard-npd-kong
    files: [dashboards/npd-kong.json]
    options: *dashboard
  - name: dashboard-npd-rabbitmq
    files: [dashboards/npd-rabbitmq.json]
    options: *dashboard
  - name: dashboard-npd-movie
    files: [dashboards/npd-movie.json]
    options: *dashboard
  # Script báo cáo Telegram 8h/15h/22h (digest/cronjob.yaml)
  - name: npd-status-digest-script
    files: [digest/report.py]
