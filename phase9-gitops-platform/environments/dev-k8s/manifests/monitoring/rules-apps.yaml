# Alert ứng dụng (team banking/shop/movie) → Alertmanager route nhanh (group_wait 10s, repeat 30m).
# Triệu chứng chính = 503/5xx (consumer down); kube rule chỉ báo khi desired>0 (không nhầm với scale=0).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: npd-banking-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: npd-monitoring
spec:
  groups:
    - name: banking.symptoms
      rules:
        - alert: BankingTransferUnavailable
          expr: |
            sum(rate(http_requests_total{namespace="npd-banking", status=~"503|504"}[5m])) > 0
          for: 0m
          labels:
            severity: critical
            team: banking
            tier: symptom
            impact: transfer
            namespace: npd-banking
            # Topology RCA: consumer transfer thường là gốc; api-producer chỉ triệu chứng 503
            deployment: transfer-service
          annotations:
            summary: "CK P2P gián đoạn — API banking trả 503/504 (kiểm tra transfer-service)"
            description: >-
              Có HTTP 503/504 trên ns npd-banking. Sau release hạn mức ngày: log Kibana logs-bank-*
              error_code=TRANSFER_DAILY_LIMIT_EXCEEDED / downstream_unavailable.
              Runbook: Argo rollback image transfer-service (banking-transfer-service).

        - alert: BankingProducer5xx
          expr: |
            sum(rate(http_requests_total{namespace="npd-banking", job=~".*api-producer.*", status=~"5.."}[5m])) > 0
          for: 0m
          labels:
            severity: critical
            team: banking
            tier: symptom
            impact: transfer
            namespace: npd-banking
            deployment: transfer-service
          annotations:
            summary: "Banking API 5xx — CK có thể không hoàn tất (transfer-service)"
            description: >-
              rate 5xx > 0 trên api-producer. Correlate topology transfer-service/npd-banking;
              Kibana: failure_code / error_code (vd TRANSFER_DAILY_LIMIT_EXCEEDED).

        # TargetDown / DeploymentUnavailable → Workload* trong rules-aiops-topology.yaml
---
# CineHome (npd-movie). Không có /metrics trong app:
#   - traffic public: cloudflared_tunnel_* (PodMonitor cinehome-cloudflared)
#   - movie-api / media-worker: traces_span_metrics_* (OTel spanmetrics, label service_name)
#   - hàng đợi transcode: redis_key_size{key="cinehome:media:jobs"}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: npd-movie-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: npd-monitoring
spec:
  groups:
    - name: movie.symptoms
      rules:
        - alert: MovieTunnelErrors
          expr: |
            sum(rate(cloudflared_tunnel_request_errors{namespace="npd-movie"}[5m]))
              / sum(rate(cloudflared_tunnel_total_requests{namespace="npd-movie"}[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
            team: movie
            tier: symptom
            namespace: npd-movie
          annotations:
            summary: "Tunnel CineHome lỗi {{ $value | humanizePercentage }} request"
            description: "cloudflared không gọi được origin movie-web:8080 (pod down/timeout). Cloudflare trả 502 cho người dùng."

        - alert: MovieApi5xx
          expr: |
            sum(rate(traces_span_metrics_calls_total{service_name="movie-api", span_kind="SPAN_KIND_SERVER", http_status_code=~"5.."}[5m]))
              / sum(rate(traces_span_metrics_calls_total{service_name="movie-api", span_kind="SPAN_KIND_SERVER"}[5m])) > 0.05
          for: 5m
          labels:
            severity: critical
            team: movie
            tier: symptom
            namespace: npd-movie
            deployment: movie-api
          annotations:
            summary: "movie-api trả 5xx {{ $value | humanizePercentage }}"
            description: "Tỷ lệ 5xx > 5% trong 5m. Xem trace lỗi: Kibana → APM → movie-api → Errors; log logs-movie-*."

        - alert: MovieApiSlow
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(traces_span_metrics_duration_milliseconds_bucket{service_name="movie-api", span_kind="SPAN_KIND_SERVER", span_name!~".*upload.*"}[5m]))
            ) > 2000
          for: 10m
          labels:
            severity: warning
            team: movie
            tier: symptom
            namespace: npd-movie
            deployment: movie-api
          annotations:
            summary: "movie-api p95 {{ $value | humanize }}ms (> 2s)"
            description: "Trang chủ/danh sách phim chậm. Kiểm tra span DB/Redis trong APM (Transactions → span breakdown)."

        - alert: MovieMediaQueueBacklog
          expr: |
            max(redis_key_size{key="cinehome:media:jobs"}) > 10
          for: 30m
          labels:
            severity: warning
            team: movie
            namespace: npd-movie
            deployment: media-worker
          annotations:
            summary: "Hàng đợi transcode tồn {{ $value }} job > 30m"
            description: "media-worker không kịp xử lý hoặc đang down. Kiểm tra kubectl -n npd-movie logs deploy/media-worker."

    # QoE đo trong trình duyệt (hls.js) → movie-api POST /api/playback/events → cinehome_playback_* / cinehome_segment_*
    # Chuỗi nguyên nhân: Rebuffer ↑ → Segment download ↑ → MinIO GET TTFB ↑ → NFS READ latency ↑ → NFS disk saturation
    - name: movie.qoe
      rules:
        - alert: MovieRebufferHigh
          expr: |
            sum(rate(cinehome_playback_rebuffer_seconds_total[10m]))
              / sum(rate(cinehome_playback_watch_seconds_total[10m])) > 0.02
            and sum(rate(cinehome_playback_watch_seconds_total[10m])) > 0
          for: 10m
          labels:
            severity: warning
            team: movie
            tier: symptom
            namespace: npd-movie
          annotations:
            summary: "Người xem bị buffer {{ $value | humanizePercentage }} thời gian xem"
            description: >-
              Rebuffer ratio > 2%. Lần theo dashboard NPD CineHome: Segment download → MinIO GET TTFB → NFS READ latency → NFS disk.

        - alert: MovieStartupSlow
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(cinehome_playback_startup_seconds_bucket[15m]))) > 3
          for: 10m
          labels:
            severity: warning
            team: movie
            tier: symptom
            namespace: npd-movie
          annotations:
            summary: "Video startup p95 {{ $value | humanizeDuration }} (> 3s)"
            description: "Từ lúc bấm play đến khung hình đầu. Kiểm tra /stream (movie-api) và segment đầu (MinIO)."

        - alert: MoviePlaybackFailures
          expr: |
            sum(increase(cinehome_playback_sessions_total{result="failed"}[15m]))
              / sum(increase(cinehome_playback_sessions_total{result=~"success|failed"}[15m])) > 0.05
            and sum(increase(cinehome_playback_sessions_total[15m])) >= 5
          for: 5m
          labels:
            severity: critical
            team: movie
            tier: symptom
            namespace: npd-movie
          annotations:
            summary: "{{ $value | humanizePercentage }} phiên xem phát lỗi"
            description: >-
              Playback success < 95%. Lỗi theo label error (fragLoadError, manifestLoadError, media_4…):
              sum by (error) (increase(cinehome_playback_sessions_total{result="failed"}[15m])).

        - alert: MovieSegmentSlow
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(cinehome_segment_load_seconds_bucket[10m]))) > 3
          for: 10m
          labels:
            severity: warning
            team: movie
            tier: cause
            namespace: npd-movie
          annotations:
            summary: "Tải segment HLS p95 {{ $value | humanizeDuration }} (segment dài 6s)"
            description: "Gần bằng độ dài segment thì buffer cạn. So với MinIO GET TTFB và băng thông tunnel."

    # DeploymentUnavailable / PodRestarting → Workload* trong rules-aiops-topology.yaml
---
# Apache Fineract (npd-fineract). Metric: Spring Boot Micrometer http_server_requests_* + hikaricp_* + logback_*.
# Transfer/BPM đo qua REST URI (không có T24 MDB counter). Alert → Telegram (team=fineract).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: npd-fineract-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: npd-monitoring
spec:
  groups:
    - name: fineract.symptoms
      rules:
        - alert: FineractServer5xx
          expr: |
            sum(rate(http_server_requests_seconds_count{namespace="npd-fineract",application="fineract",status=~"5.."}[5m])) > 0
          for: 1m
          labels:
            severity: critical
            team: fineract
            tier: symptom
            impact: api
            namespace: npd-fineract
            deployment: fineract-server
          annotations:
            summary: "Fineract API trả 5xx"
            description: >-
              Có HTTP 5xx trên fineract-server. Xem Grafana NPD Fineract + Instana traces;
              log pod: kubectl -n npd-fineract logs deploy/fineract-server --tail=200.

        - alert: FineractHighErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{namespace="npd-fineract",application="fineract",outcome="SERVER_ERROR"}[5m]))
              / clamp_min(sum(rate(http_server_requests_seconds_count{namespace="npd-fineract",application="fineract"}[5m])), 1e-9) > 0.05
          for: 5m
          labels:
            severity: critical
            team: fineract
            tier: symptom
            namespace: npd-fineract
            deployment: fineract-server
          annotations:
            summary: "Fineract SERVER_ERROR {{ $value | humanizePercentage }} (>5%)"
            description: "Tỷ lệ lỗi server > 5% trong 5m — kiểm tra DB/pool, OOM, exception trong log."

        - alert: FineractTransferErrors
          expr: |
            sum(rate(http_server_requests_seconds_count{namespace="npd-fineract",application="fineract",uri=~".*accounttransfers.*",status=~"[45].."}[5m])) > 0
          for: 2m
          labels:
            severity: critical
            team: fineract
            tier: symptom
            impact: transfer
            namespace: npd-fineract
            deployment: fineract-server
          annotations:
            summary: "Giao dịch chuyển tiền (accounttransfers) lỗi"
            description: >-
              4xx/5xx trên /accounttransfers (V1 synthetic / teller transfer).
              Instana filter X-Business-Flow=txn.transfer; Grafana panel BPM lỗi.

        - alert: FineractSavingsTxnErrors
          expr: |
            sum(rate(http_server_requests_seconds_count{namespace="npd-fineract",application="fineract",uri=~".*savingsaccounts.*/transactions.*",status=~"[45].."}[5m])) > 0
          for: 2m
          labels:
            severity: warning
            team: fineract
            tier: symptom
            impact: savings
            namespace: npd-fineract
            deployment: fineract-server
          annotations:
            summary: "Giao dịch savings (deposit/withdraw) lỗi"
            description: "4xx/5xx trên savingsaccounts/.../transactions (V2/V3). Kiểm tra balance/product/currency."

        - alert: FineractLoanBpmErrors
          expr: |
            sum(rate(http_server_requests_seconds_count{namespace="npd-fineract",application="fineract",uri=~".*/loans.*",status=~"[45].."}[5m])) > 0
          for: 2m
          labels:
            severity: critical
            team: fineract
            tier: symptom
            impact: bpm-loan
            namespace: npd-fineract
            deployment: fineract-server
          annotations:
            summary: "BPM loan (apply/approve/disburse/repay) lỗi"
            description: >-
              4xx/5xx trên /loans* (B2/B3). Correlate X-Business-Flow=bpm.loan.* và X-Correlation-ID trên Instana.

        - alert: FineractClientOnboardErrors
          expr: |
            sum(rate(http_server_requests_seconds_count{namespace="npd-fineract",application="fineract",uri=~".*/clients.*",status=~"5.."}[5m])) > 0
          for: 2m
          labels:
            severity: warning
            team: fineract
            tier: symptom
            impact: bpm-onboard
            namespace: npd-fineract
            deployment: fineract-server
          annotations:
            summary: "BPM onboard client 5xx"
            description: "5xx trên /clients* (B1). 4xx validation không alert (noise)."

        - alert: FineractSlowApi
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_server_requests_seconds_bucket{namespace="npd-fineract",application="fineract"}[5m]))
            ) > 5
          for: 10m
          labels:
            severity: warning
            team: fineract
            tier: symptom
            namespace: npd-fineract
            deployment: fineract-server
          annotations:
            summary: "Fineract API p95 {{ $value | humanizeDuration }} (>5s)"
            description: "Latency cao — kiểm tra HikariCP, Postgres, CPU/heap trên dashboard NPD Fineract."

    - name: fineract.system
      rules:
        - alert: FineractDbPoolSaturated
          expr: |
            max(hikaricp_connections_pending{namespace="npd-fineract"}) > 0
            or
            (
              max(hikaricp_connections_active{namespace="npd-fineract"})
                / clamp_min(max(hikaricp_connections_max{namespace="npd-fineract"}), 1)
            ) > 0.9
          for: 5m
          labels:
            severity: critical
            team: fineract
            tier: cause
            namespace: npd-fineract
            deployment: fineract-server
          annotations:
            summary: "HikariCP pool gần cạn / có pending"
            description: "DB connection sát max hoặc pending>0 — giao dịch sẽ timeout/5xx."

        - alert: FineractJvmHeapHigh
          expr: |
            sum(jvm_memory_used_bytes{namespace="npd-fineract",area="heap"})
              / clamp_min(sum(jvm_memory_max_bytes{namespace="npd-fineract",area="heap"}), 1) > 0.9
          for: 10m
          labels:
            severity: warning
            team: fineract
            tier: cause
            namespace: npd-fineract
            deployment: fineract-server
          annotations:
            summary: "JVM heap Fineract > 90%"
            description: "Nguy cơ OOM / GC thrash. Xem JAVA_TOOL_OPTIONS -Xmx và memory limit pod."

        - alert: FineractLogErrors
          expr: |
            sum(rate(logback_events_total{namespace="npd-fineract",level="error"}[5m])) > 0.2
          for: 5m
          labels:
            severity: warning
            team: fineract
            tier: symptom
            namespace: npd-fineract
            deployment: fineract-server
          annotations:
            summary: "Fineract log ERROR ~{{ $value | humanize }} /s"
            description: "Logback error rate cao — grep exception trong pod log / Instana Error Messages."

        - alert: FineractDeploymentUnavailable
          expr: |
            kube_deployment_status_replicas_unavailable{namespace="npd-fineract",deployment="fineract-server"} > 0
            and
            kube_deployment_spec_replicas{namespace="npd-fineract",deployment="fineract-server"} > 0
          for: 5m
          labels:
            severity: critical
            team: fineract
            tier: kube
            namespace: npd-fineract
            deployment: fineract-server
          annotations:
            summary: "fineract-server unavailable"
            description: "desired>0 nhưng unavailable>0 — crash/probe/ImagePull/vault-agent-init."
