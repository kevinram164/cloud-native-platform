# Alert infra dùng chung (team infra): datastore, Kafka, Kong, RabbitMQ, MinIO, Elasticsearch.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: npd-infra-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: npd-monitoring
spec:
  groups:
    - name: infra.datastore
      rules:
        - alert: PostgresDown
          expr: |
            pg_up{namespace="postgres"} == 0 or up{namespace="postgres"} == 0
          for: 3m
          labels:
            severity: critical
            team: infra
          annotations:
            summary: "Postgres {{ $labels.pod }} down"
            description: "Exporter không kết nối được Postgres hoặc target down 3m ({{ $labels.instance }})."

        - alert: PostgresTooManyConnections
          expr: |
            sum by (pod) (pg_stat_activity_count{namespace="postgres"})
              / on (pod) max by (pod) (pg_settings_max_connections{namespace="postgres"}) > 0.8
          for: 10m
          labels:
            severity: warning
            team: infra
          annotations:
            summary: "Postgres {{ $labels.pod }} dùng > 80% max_connections"
            description: "Tỉ lệ kết nối {{ $value | humanizePercentage }}."

        - alert: RedisDown
          expr: |
            redis_up{namespace="redis"} == 0 or up{namespace="redis"} == 0
          for: 3m
          labels:
            severity: critical
            team: infra
          annotations:
            summary: "Redis {{ $labels.pod }} down"
            description: "Redis scrape target down 3m."

    - name: infra.kafka
      rules:
        - alert: KafkaTargetDown
          expr: |
            up{namespace="kafka"} == 0
          for: 5m
          labels:
            severity: warning
            team: infra
          annotations:
            summary: "Kafka scrape target down"
            description: "Kafka/exporter target {{ $labels.instance }} down 5m."

        - alert: KafkaUnderReplicatedPartitions
          expr: |
            sum(kafka_server_replicamanager_underreplicatedpartitions{namespace="kafka"}) > 0
          for: 10m
          labels:
            severity: warning
            team: infra
          annotations:
            summary: "Kafka có partition under-replicated"
            description: "{{ $value }} partition under-replicated trong 10m — broker chậm hoặc mất."

        - alert: KafkaConsumerLagHigh
          expr: |
            sum by (consumergroup, topic) (kafka_consumergroup_lag{namespace="kafka"}) > 1000
          for: 10m
          labels:
            severity: warning
            team: infra
          annotations:
            summary: "Kafka consumer lag high"
            description: "Group {{ $labels.consumergroup }} topic {{ $labels.topic }} lag {{ $value }}."

    - name: infra.gateway
      rules:
        - alert: KongDown
          expr: |
            up{namespace="kong"} == 0
          for: 3m
          labels:
            severity: critical
            team: infra
          annotations:
            summary: "Kong metrics target down"
            description: "Kong instance {{ $labels.instance }} down."

        - alert: KongDatastoreUnreachable
          expr: |
            kong_datastore_reachable{namespace="kong"} == 0
          for: 2m
          labels:
            severity: critical
            team: infra
          annotations:
            summary: "Kong không kết nối được Postgres"
            description: "kong_datastore_reachable=0 trên {{ $labels.instance }}."

        - alert: RabbitmqDown
          expr: |
            up{namespace="rabbit"} == 0
          for: 5m
          labels:
            severity: warning
            team: infra
          annotations:
            summary: "RabbitMQ metrics target down"
            description: "Rabbit scrape down — kiểm tra pod rabbitmq-0 / plugin rabbitmq_prometheus."

        - alert: RabbitmqQueueBacklog
          expr: |
            sum by (queue) (rabbitmq_queue_messages_ready{namespace="rabbit"}) > 1000
          for: 10m
          labels:
            severity: warning
            team: infra
          annotations:
            summary: "RabbitMQ queue {{ $labels.queue }} tồn > 1000 message"
            description: "Consumer chậm hoặc dừng ({{ $value }} message ready)."

    - name: infra.storage
      rules:
        - alert: MinioDown
          expr: |
            up{namespace="minio"} == 0
          for: 5m
          labels:
            severity: warning
            team: infra
          annotations:
            summary: "MinIO metrics target down"
            description: "MinIO {{ $labels.instance }} không scrape được 5m."

        - alert: PersistentVolumeFilling
          expr: |
            kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.15
            and kubelet_volume_stats_used_bytes > 0
          for: 15m
          labels:
            severity: warning
            team: infra
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} còn < 15%"
            description: "Dung lượng trống {{ $value | humanizePercentage }}. NFS subdir: số liệu theo quota PVC."

    # MinIO S3 (endpoint /minio/v2/metrics/cluster). ttfb_seconds_distribution là histogram tích luỹ có label le (không có hậu tố _bucket).
    - name: infra.minio-s3
      rules:
        - alert: MinioGetSlow
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(minio_s3_requests_ttfb_seconds_distribution{api="getobject"}[10m]))) > 0.5
          for: 10m
          labels:
            severity: warning
            team: infra
          annotations:
            summary: "MinIO GET TTFB p95 {{ $value | humanizeDuration }} (> 500ms)"
            description: "Segment HLS trả chậm → người xem buffer. Kiểm tra NFS READ latency (mountstats) và disk NFS server."

        - alert: MinioS3Errors
          expr: |
            sum(rate(minio_s3_requests_5xx_errors_total[5m])) / sum(rate(minio_s3_requests_total[5m])) > 0.01
          for: 5m
          labels:
            severity: warning
            team: infra
          annotations:
            summary: "MinIO 5xx {{ $value | humanizePercentage }} request S3"
            description: "Lỗi phía MinIO (disk/NFS). Log: kubectl -n minio logs deploy/minio."

    # NFS 10.100.1.180: client = mountstats trên worker (node-exporter), server = node_exporter job nfs-server.
    - name: infra.nfs
      rules:
        - alert: NfsServerDown
          expr: |
            up{job="nfs-server"} == 0
          for: 5m
          labels:
            severity: critical
            team: infra
          annotations:
            summary: "node_exporter NFS server {{ $labels.instance }} không scrape được"
            description: "Server NFS sập hoặc node_exporter dừng/firewall :9100. Mọi PVC nfs-csi phụ thuộc server này."

        - alert: NfsClientReadSlow
          expr: |
            sum by (instance) (rate(node_mountstats_nfs_operations_request_time_seconds_total{operation="READ"}[5m]))
              / sum by (instance) (rate(node_mountstats_nfs_operations_requests_total{operation="READ"}[5m])) > 0.05
          for: 10m
          labels:
            severity: warning
            team: infra
          annotations:
            summary: "NFS READ trung bình {{ $value | humanizeDuration }} trên {{ $labels.instance }}"
            description: "Độ trễ đọc NFS phía client > 50ms (mạng hoặc disk server). So với NfsServerDiskReadSlow để khoanh vùng."

        - alert: NfsServerDiskReadSlow
          expr: |
            rate(node_disk_read_time_seconds_total{job="nfs-server"}[5m])
              / rate(node_disk_reads_completed_total{job="nfs-server"}[5m]) > 0.03
            and rate(node_disk_reads_completed_total{job="nfs-server"}[5m]) > 1
          for: 10m
          labels:
            severity: warning
            team: infra
          annotations:
            summary: "Disk {{ $labels.device }} NFS server đọc {{ $value | humanizeDuration }}/IO"
            description: "Read latency > 30ms. Nếu NFS client chậm mà disk nhanh → nghẽn mạng/nfsd threads."

        - alert: NfsServerDiskSaturated
          expr: |
            rate(node_disk_io_time_seconds_total{job="nfs-server"}[5m]) > 0.9
          for: 15m
          labels:
            severity: warning
            team: infra
          annotations:
            summary: "Disk {{ $labels.device }} NFS server bận {{ $value | humanizePercentage }}"
            description: "I/O utilization > 90% trong 15m — disk bão hoà, mọi PVC nfs-csi chậm."

        - alert: NfsServerFilesystemFilling
          expr: |
            node_filesystem_avail_bytes{job="nfs-server", fstype!~"tmpfs|overlay"}
              / node_filesystem_size_bytes{job="nfs-server", fstype!~"tmpfs|overlay"} < 0.15
          for: 15m
          labels:
            severity: warning
            team: infra
          annotations:
            summary: "NFS server {{ $labels.mountpoint }} còn {{ $value | humanizePercentage }}"
            description: "Dung lượng thật của export (quota PVC nfs-csi không giới hạn được disk server)."
