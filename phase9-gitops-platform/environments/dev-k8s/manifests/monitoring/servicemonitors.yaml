# ServiceMonitor/PodMonitor — tất cả đặt ở ns monitoring, chọn target qua namespaceSelector.
# Lý do: ns app (npd-banking, npd-shop) có thể chưa tồn tại; nếu đặt CR trong ns đó, app ArgoCD
# fail cả lượt sync. Label `namespace` của series vẫn là ns của target (dashboard/rule không đổi).
#
# App: Prometheus Operator gắn label target `endpoint`=<port>, đè label app `endpoint`=/api/...
# → dashboard transfer chết. Fix: honorLabels + labeldrop endpoint.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: banking-services
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: npd-monitoring
spec:
  namespaceSelector:
    matchNames: [npd-banking]
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [api-producer, auth-service, account-service, transfer-service, notification-service, shop-bridge]
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
      relabelings:
        - action: labeldrop
          regex: endpoint
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: npd-shop-services
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: npd-monitoring
spec:
  namespaceSelector:
    matchNames: [npd-shop]
  selector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [gateway, auth-service, catalog-service, order-service, payment-worker, shop-web]
  endpoints:
    - targetPort: 8080
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
      relabelings:
        - action: labeldrop
          regex: endpoint
---
