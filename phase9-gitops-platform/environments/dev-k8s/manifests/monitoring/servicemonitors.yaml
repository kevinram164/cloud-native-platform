# Strimzi: broker (JMX exporter, chart npd-kafka metricsConfig) + kafka-exporter đều expose port tcp-prometheus
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kafka-resources
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: npd-monitoring
spec:
  namespaceSelector:
    matchNames: [kafka]
  selector:
    matchExpressions:
      - key: strimzi.io/kind
        operator: In
        values: [Kafka]
  podMetricsEndpoints:
    - port: tcp-prometheus
      path: /metrics
      interval: 30s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_strimzi_io_name]
          targetLabel: strimzi_io_name
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node_name
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: strimzi-cluster-operator
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: npd-monitoring
spec:
  namespaceSelector:
    matchNames: [kafka]
  selector:
    matchLabels:
      strimzi.io/kind: cluster-operator
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 60s
---
# OTel Collector spanmetrics (:8889): RED metrics sinh từ trace của mọi app gửi OTLP (movie-api, media-worker…).
# honorLabels: giữ job/instance do exporter đặt (service.name / service.instance.id), không ghi đè bằng target collector.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-spanmetrics
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: npd-monitoring
spec:
  namespaceSelector:
    matchNames: [observability]
  selector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
      app.kubernetes.io/instance: opentelemetry-collector
  endpoints:
    - port: spanmetrics
      path: /metrics
      interval: 30s
      honorLabels: true
---
