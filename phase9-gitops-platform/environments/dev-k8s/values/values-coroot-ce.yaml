# Coroot CE — dev-k8s (namespace observability)
# UI: https://npd-coroot.co (manifests/ingress/coroot.yaml)
# OTLP: coroot-coroot.observability:4317 (gRPC) / :8080 (HTTP)

storage:
  size: 5Gi
  className: nfs-csi

clickhouse:
  shards: 1
  replicas: 1
  storage:
    size: 10Gi
    className: nfs-csi

prometheus:
  storage:
    size: 5Gi
    className: nfs-csi

nodeAgent:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  ebpfTracer:
    enabled: false
  ebpfProfiler:
    enabled: false
  logCollector:
    collectLogBasedMetrics: true
    collectLogEntries: true

clusterAgent:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
