# OpenTelemetry Collector — dev-k8s, gateway OTLP → Elastic APM Server (traces/metrics/logs)
# Chart: open-telemetry/opentelemetry-collector
# App gửi OTLP tới opentelemetry-collector.observability:4317 (gRPC) / :4318 (HTTP).
# APM Server (ECK, manifests/elastic/apm-server.yaml) nhận OTLP gRPC native trên :8200.
# spanmetrics: sinh RED metrics từ trace (traces_span_metrics_calls_total, ..._duration_milliseconds_bucket)
# → :8889/metrics → ServiceMonitor otel-spanmetrics (manifests/monitoring) → Grafana. App không cần /metrics.
# Metrics OTLP do app tự ghi (pipeline metrics) cũng ra cùng :8889.

fullnameOverride: opentelemetry-collector
mode: deployment
replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.114.0"

presets:
  kubernetesAttributes:
    enabled: true

extraEnvs:
  - name: MY_POD_IP
    valueFrom:
      fieldRef:
        fieldPath: status.podIP
  # Secret do ECK tạo cùng ns observability
  - name: APM_SECRET_TOKEN
    valueFrom:
      secretKeyRef:
        name: apm-apm-token
        key: secret-token

config:
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  processors:
    batch:
      timeout: 5s
      send_batch_size: 1024
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    resource:
      attributes:
        - key: cluster.name
          value: npd-k8s
          action: upsert
        - key: service.instance.id
          from_attribute: k8s.pod.uid
          action: insert
        - key: host.name
          from_attribute: k8s.node.name
          action: insert
        # APM UI nhóm theo environment
        - key: deployment.environment
          value: dev-k8s
          action: insert
  connectors:
    spanmetrics:
      histogram:
        explicit:
          buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2500ms, 5s, 10s, 30s, 60s, 300s, 900s]
      # semconv cũ (instrumentation 0.48b0) + mới
      dimensions:
        - name: http.method
        - name: http.status_code
        - name: http.request.method
        - name: http.response.status_code
      # Không nhóm theo pod uid/IP → series không nhân lên mỗi lần rollout
      resource_metrics_key_attributes: [service.name, service.namespace]
      metrics_flush_interval: 15s
      metrics_expiration: 10m
  exporters:
    prometheus:
      endpoint: ${env:MY_POD_IP}:8889
      resource_to_telemetry_conversion:
        enabled: false
    otlp/apm:
      endpoint: apm-apm-http.observability.svc.cluster.local:8200
      tls:
        insecure: true
      headers:
        Authorization: "Bearer ${env:APM_SECRET_TOKEN}"
      sending_queue:
        enabled: true
        queue_size: 2000
      retry_on_failure:
        enabled: true
        max_elapsed_time: 120s
  service:
    extensions: [health_check]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, resource, batch]
        exporters: [otlp/apm, spanmetrics]
      metrics/spanmetrics:
        receivers: [spanmetrics]
        exporters: [prometheus]
      # Metrics OTLP của app (vd. cinehome_playback_* từ movie-api) → APM + Prometheus
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, resource, batch]
        exporters: [otlp/apm, prometheus]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, resource, batch]
        exporters: [otlp/apm]

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

ports:
  spanmetrics:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP

service:
  type: ClusterIP
